# EEAP Redis: event streams (durable), cache, rate limiting, agent job queues.
bind 0.0.0.0
protected-mode yes
port 6379

# Durability for Redis Streams; outbox tables allow rebuild if Redis data is lost.
appendonly yes
appendfsync everysec
dir /data

maxmemory 1gb
# Streams must never be evicted; cache keys carry TTLs instead.
maxmemory-policy noeviction

rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command CONFIG ""

# requirepass is generated at container start from the Docker secret.
include /run/redis-auth/auth.conf
