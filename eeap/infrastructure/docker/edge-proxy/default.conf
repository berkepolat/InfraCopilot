# EEAP edge proxy: TLS termination, agent mTLS verification, coarse rate limiting, path filtering.

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_ip:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

upstream eeap_gateway  { server api-gateway:8000; keepalive 32; }
upstream eeap_frontend { server frontend:3000;    keepalive 16; }

map $http_x_request_id $eeap_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_name _;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate         /run/secrets/tls_cert;
    ssl_certificate_key     /run/secrets/tls_key;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_tickets     off;

    # Agents present certificates issued by the EEAP Agent CA; browsers present none.
    ssl_client_certificate  /run/secrets/agent_ca_cert;
    ssl_verify_client       optional;
    ssl_verify_depth        2;

    client_max_body_size    1m;
    limit_conn              conn_ip 50;
    limit_req               zone=per_ip burst=60 nodelay;
    limit_req_status        429;
    limit_conn_status       429;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Request-ID      $eeap_request_id;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Never trust client-supplied certificate headers.
    proxy_set_header X-Client-Cert        "";
    proxy_set_header X-Client-Cert-Verify "";

    # Internal-only endpoints are never reachable from outside.
    location ~ ^/(metrics|health/ready|internal)(/|$)   { return 404; }
    location ~ ^/api/v1/(metrics|health/ready|internal) { return 404; }

    location = /api/v1/auth/login {
        limit_req zone=auth_ip burst=5 nodelay;
        proxy_pass http://eeap_gateway;
    }

    # Enrollment: server-authenticated TLS only (no client cert yet).
    location = /api/v1/agent/enroll {
        limit_req zone=auth_ip burst=5 nodelay;
        proxy_pass http://eeap_gateway;
    }

    location = /api/v1/agent/uploads {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        client_max_body_size 50m;
        proxy_request_buffering off;
        proxy_set_header X-Client-Cert        $ssl_client_escaped_cert;
        proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
        proxy_pass http://eeap_gateway;
    }

    location /api/v1/agent/ {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        proxy_set_header X-Client-Cert        $ssl_client_escaped_cert;
        proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
        proxy_pass http://eeap_gateway;
    }

    location = /api/v1/imports {
        client_max_body_size 50m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://eeap_gateway;
    }

    location /api/v1/ {
        proxy_pass http://eeap_gateway;
    }

    # Frontend BFF sign-in (exchanges credentials with the gateway server-side).
    location = /api/session {
        limit_req zone=auth_ip burst=5 nodelay;
        proxy_pass http://eeap_frontend;
    }

    location / {
        proxy_pass http://eeap_frontend;
    }
}
