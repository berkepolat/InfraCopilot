# Enterprise Exposure Assessment Platform — Docker Compose topology.
#
#   docker compose up -d                                   # data tier (Phase 1 validation)
#   docker compose --profile app up -d                     # full platform (Phase 2+)
#   docker compose --profile app --profile observability up -d
#
# Secrets are generated by ./scripts/generate-secrets.sh into ./secrets (git-ignored).

name: eeap

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  user: "10001:10001"

x-python-healthcheck: &python-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).status == 200 else 1)"]
  interval: 15s
  timeout: 3s
  retries: 5
  start_period: 20s

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker.heartbeat') < 30 else 1)"]
  interval: 15s
  timeout: 3s
  retries: 5
  start_period: 30s

x-backend-env: &backend-env
  EEAP_ENV: ${EEAP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: json
  REDIS_URL: redis://redis:6379/0
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
  INTERNAL_TOKEN_PUBLIC_KEY_FILE: /run/secrets/internal_token_public_key
  ASSET_SERVICE_URL: http://asset-service:8000
  ASSESSMENT_SERVICE_URL: http://assessment-service:8000
  RELATIONSHIP_ENGINE_URL: http://relationship-engine:8000
  AI_ENGINE_URL: http://ai-engine:8000
  REPORTING_SERVICE_URL: http://reporting-service:8000
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}

x-backend-secrets: &backend-secrets
  - redis_password
  - jwt_public_key
  - internal_token_public_key

x-data-deps: &data-deps
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  # ======================================================================= data tier (default profile)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: eeap
      POSTGRES_USER: eeap_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
      SECRETS_DIR: /run/secrets
    secrets:
      - postgres_superuser_password
      - db_password_gateway
      - db_password_asset
      - db_password_assessment
      - db_password_relationship
      - db_password_ai
      - db_password_reporting
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - log_min_duration_statement=1000
      - -c
      - password_encryption=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eeap_admin -d eeap"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [eeap-data]
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *logging
    secrets: [redis_password]
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    # requirepass is written to a tmpfs include file so the password never appears in argv or env.
    command:
      - sh
      - -c
      - printf 'requirepass "%s"\n' "$$(cat /run/secrets/redis_password)" > /run/redis-auth/auth.conf && exec redis-server /usr/local/etc/redis/redis.conf
    tmpfs:
      - /run/redis-auth:mode=0700,uid=999,gid=1000
    user: "999:1000"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [eeap-data]
    security_opt:
      - no-new-privileges:true

  minio:
    # Upstream minio/minio images were withdrawn from Docker Hub; pgsty builds the same source (ADR-0006).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    logging: *logging
    secrets: [minio_root_user, minio_root_password]
    environment:
      MINIO_BROWSER: "on"
      MINIO_PROMETHEUS_AUTH_TYPE: public
    entrypoint:
      - sh
      - -c
      - MINIO_ROOT_USER="$$(cat /run/secrets/minio_root_user)" MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_root_password)" exec minio server /data --console-address :9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [eeap-data]
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    restart: "no"
    logging: *logging
    depends_on:
      minio:
        condition: service_healthy
    secrets:
      - minio_root_user
      - minio_root_password
      - minio_secret_assessment
      - minio_secret_ai
      - minio_secret_reporting
      - minio_secret_backup
    volumes:
      - ./infrastructure/minio:/init:ro
    entrypoint: ["/bin/sh", "/init/init-buckets.sh"]
    networks: [eeap-data]

  # ======================================================================= edge (profile: app)
  edge-proxy:
    profiles: [app]
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      api-gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${EEAP_HTTPS_PORT:-443}:8443"
      - "${EEAP_HTTP_PORT:-80}:8080"
    environment:
      EEAP_PUBLIC_HOSTNAME: ${EEAP_PUBLIC_HOSTNAME:-eeap.local}
    secrets: [tls_cert, tls_key, agent_ca_cert]
    volumes:
      - ./infrastructure/docker/edge-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks: [eeap-edge]

  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ${EEAP_REGISTRY:-eeap}/frontend:${EEAP_VERSION:-0.1.0}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=10001,gid=10001
    environment:
      NODE_ENV: production
      GATEWAY_INTERNAL_URL: http://api-gateway:8000
      EEAP_PUBLIC_URL: https://${EEAP_PUBLIC_HOSTNAME:-eeap.local}
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks: [eeap-edge, eeap-backend]

  # ======================================================================= gateway (profile: app)
  api-gateway-migrate:
    profiles: [app]
    build: &build-api-gateway
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: ${EEAP_REGISTRY:-eeap}/api-gateway:${EEAP_VERSION:-0.1.0}
    restart: "no"
    logging: *logging
    <<: *hardening
    environment:
      <<: *backend-env
      EEAP_ROLE: migrate
      DATABASE_URL: postgresql+asyncpg://eeap_gateway@postgres:5432/eeap
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_gateway
    secrets: [db_password_gateway, redis_password, jwt_public_key, internal_token_public_key]
    depends_on: *data-deps
    networks: [eeap-data]

  api-gateway:
    profiles: [app]
    build: *build-api-gateway
    image: ${EEAP_REGISTRY:-eeap}/api-gateway:${EEAP_VERSION:-0.1.0}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    environment:
      <<: *backend-env
      EEAP_ROLE: api
      SERVICE_NAME: api-gateway
      DATABASE_URL: postgresql+asyncpg://eeap_gateway@postgres:5432/eeap
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_gateway
      JWT_SIGNING_KEY_FILE: /run/secrets/jwt_signing_key
      INTERNAL_TOKEN_PRIVATE_KEY_FILE: /run/secrets/internal_token_private_key
      AGENT_CA_CERT_FILE: /run/secrets/agent_ca_cert
      AGENT_CA_KEY_FILE: /run/secrets/agent_ca_key
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-28800}
      AGENT_CERT_VALIDITY_DAYS: ${AGENT_CERT_VALIDITY_DAYS:-30}
      RATE_LIMIT_LOGIN_PER_IP: ${RATE_LIMIT_LOGIN_PER_IP:-10/minute}
      RATE_LIMIT_USER: ${RATE_LIMIT_USER:-600/minute}
      RATE_LIMIT_API_KEY: ${RATE_LIMIT_API_KEY:-1200/minute}
      RATE_LIMIT_AGENT: ${RATE_LIMIT_AGENT:-60/minute}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    secrets:
      - db_password_gateway
      - redis_password
      - jwt_public_key
      - jwt_signing_key
      - internal_token_public_key
      - internal_token_private_key
      - agent_ca_cert
      - agent_ca_key
    depends_on:
      api-gateway-migrate:
        condition: service_completed_successfully
      asset-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
      relationship-engine:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
    healthcheck: *python-healthcheck
    networks: [eeap-edge, eeap-backend, eeap-data]

  # ======================================================================= asset service (profile: app)
  asset-service-migrate:
    profiles: [app]
    build: &build-asset-service
      context: .
      dockerfile: services/asset-service/Dockerfile
    image: ${EEAP_REGISTRY:-eeap}/asset-service:${EEAP_VERSION:-0.1.0}
    restart: "no"
    logging: *logging
    <<: *hardening
    environment:
      <<: *backend-env
      EEAP_ROLE: migrate
      DATABASE_URL: postgresql+asyncpg://eeap_asset@postgres:5432/eeap
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_asset
    secrets: [db_password_asset, redis_password, jwt_public_key, internal_token_public_key]
    depends_on: *data-deps
    networks: [eeap-data]

  asset-service:
    profiles: [app]
    build: *build-asset-service
    image: ${EEAP_REGISTRY:-eeap}/asset-service:${EEAP_VERSION:-0.1.0}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    environment:
      <<: *backend-env
      EEAP_ROLE: api
      SERVICE_NAME: asset-service
      EEAP_RUN_EMBEDDED_WORKER: "true"      # low-volume discovery consumer runs in-process
      DATABASE_URL: postgresql+asyncpg://eeap_asset@postgres:5432/eeap
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_asset
    secrets: [db_password_asset, redis_password, jwt_public_key, internal_token_public_key]
    depends_on:
      asset-service-migrate:
        condition: service_completed_successfully
    healthcheck: *python-healthcheck
    networks: [eeap-backend, eeap-data]

  # ======================================================================= assessment service (profile: app)
  assessment-service-migrate:
    profiles: [app]
    build: &build-assessment-service
      context: .
      dockerfile: services/assessment-service/Dockerfile
    image: ${EEAP_REGISTRY:-eeap}/assessment-service:${EEAP_VERSION:-0.1.0}
    restart: "no"
    logging: *logging
    <<: *hardening
    environment:
      <<: *backend-env
      EEAP_ROLE: migrate
      DATABASE_URL: postgresql+asyncpg://eeap_assessment@postgres:5432/eeap
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_assessment
    secrets: [db_password_assessment, redis_password, jwt_public_key, internal_token_public_key]
    depends_on: *data-deps
    networks: [eeap-data]

  assessment-service:
    profiles: [app]
    build: *build-assessment-service
    image: ${EEAP_REGISTRY:-eeap}/assessment-service:${EEAP_VERSION:-0.1.0}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    environment: &assessment-env
      <<: *backend-env
      EEAP_ROLE: api
      SERVICE_NAME: assessment-service
      DATABASE_URL: postgresql+asyncpg://eeap_assessment@postgres:5432/eeap
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_assessment
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: svc-assessment
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_assessment
      EVIDENCE_BUCKET: eeap-evidence
      IMPORTS_BUCKET: eeap-imports
      AGENT_JOB_TTL_HOURS: ${AGENT_JOB_TTL_HOURS:-24}
      SCAN_ALLOWED_CIDRS: ${SCAN_ALLOWED_CIDRS:-}
    secrets: &assessment-secrets
      - db_password_assessment
      - redis_password
      - jwt_public_key
      - internal_token_public_key
      - minio_secret_assessment
    depends_on:
      assessment-service-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck: *python-healthcheck
    networks: [eeap-backend, eeap-data, eeap-scan]

  assessment-worker:
    profiles: [app]
    build: *build-assessment-service
    image: ${EEAP_REGISTRY:-eeap}/assessment-service:${EEAP_VERSION:-0.1.0}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    environment:
      <<: *assessment-env
      EEAP_ROLE: worker
      WORKER_CONSUMER_GROUPS: assessment-service.orchestrator,assessment-service.evaluator,assessment-service.imports
      # Read-only AD collection over LDAPS (ADR-0011). Empty AD_LDAP_URL = AD module not configured.
      AD_LDAP_URL: ${AD_LDAP_URL:-}
      AD_BASE_DN: ${AD_BASE_DN:-}
      AD_BIND_USER: ${AD_BIND_USER:-}
      AD_BIND_PASSWORD_FILE: /run/secrets/ad_bind_password
      AD_TLS_CA_FILE: ${AD_TLS_CA_FILE:-}
    secrets:
      - db_password_assessment
      - redis_password
      - jwt_public_key
      - internal_token_public_key
      - minio_secret_assessment
      - ad_bind_password
    depends_on:
      assessment-service:
        condition: service_healthy
    healthcheck: *worker-healthcheck
    deploy:
      replicas: ${ASSESSMENT_WORKER_REPLICAS:-2}
      resources:
        limits: {cpus: "2", memory: 2g}
    networks: [eeap-backend, eeap-data, eeap-scan]

  # ======================================================================= relationship engine (profile: app)
  relationship-engine-migrate:
    profiles: [app]
    build: &build-relationship-engine
      context: .
      dockerfile: services/relationship-engine/Dockerfile
    image: ${EEAP_REGISTRY:-eeap}/relationship-engine:${EEAP_VERSION:-0.1.0}
    restart: "no"
    logging: *logging
    <<: *hardening
    environment:
      <<: *backend-env
      EEAP_ROLE: migrate
      DATABASE_URL: postgresql+asyncpg://eeap_relationship@postgres:5432/eeap
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_relationship
    secrets: [db_password_relationship, redis_password, jwt_public_key, internal_token_public_key]
    depends_on: *data-deps
    networks: [eeap-data]

  relationship-engine:
    profiles: [app]
    build: *build-relationship-engine
    image: ${EEAP_REGISTRY:-eeap}/relationship-engine:${EEAP_VERSION:-0.1.0}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    environment: &relationship-env
      <<: *backend-env
      EEAP_ROLE: api
      SERVICE_NAME: relationship-engine
      DATABASE_URL: postgresql+asyncpg://eeap_relationship@postgres:5432/eeap
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_relationship
      GRAPH_MAX_PATH_DEPTH: ${GRAPH_MAX_PATH_DEPTH:-6}
      GRAPH_MAX_RESPONSE_NODES: ${GRAPH_MAX_RESPONSE_NODES:-2000}
      GRAPH_ANALYSIS_DEBOUNCE_SECONDS: ${GRAPH_ANALYSIS_DEBOUNCE_SECONDS:-60}
    secrets: &relationship-secrets [db_password_relationship, redis_password, jwt_public_key, internal_token_public_key]
    depends_on:
      relationship-engine-migrate:
        condition: service_completed_successfully
    healthcheck: *python-healthcheck
    networks: [eeap-backend, eeap-data]

  relationship-worker:
    profiles: [app]
    build: *build-relationship-engine
    image: ${EEAP_REGISTRY:-eeap}/relationship-engine:${EEAP_VERSION:-0.1.0}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    environment:
      <<: *relationship-env
      EEAP_ROLE: worker
      WORKER_CONSUMER_GROUPS: relationship-engine.ingest,relationship-engine.analysis
    secrets: *relationship-secrets
    depends_on:
      relationship-engine:
        condition: service_healthy
    healthcheck: *worker-healthcheck
    deploy:
      resources:
        limits: {cpus: "2", memory: 4g}
    networks: [eeap-backend, eeap-data]

  # ======================================================================= AI engine (profile: app)
  ai-engine-migrate:
    profiles: [app]
    build: &build-ai-engine
      context: .
      dockerfile: services/ai-engine/Dockerfile
    image: ${EEAP_REGISTRY:-eeap}/ai-engine:${EEAP_VERSION:-0.1.0}
    restart: "no"
    logging: *logging
    <<: *hardening
    environment:
      <<: *backend-env
      EEAP_ROLE: migrate
      DATABASE_URL: postgresql+asyncpg://eeap_ai@postgres:5432/eeap
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_ai
    secrets: [db_password_ai, redis_password, jwt_public_key, internal_token_public_key]
    depends_on: *data-deps
    networks: [eeap-data]

  ai-engine:
    profiles: [app]
    build: *build-ai-engine
    image: ${EEAP_REGISTRY:-eeap}/ai-engine:${EEAP_VERSION:-0.1.0}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    environment: &ai-env
      <<: *backend-env
      EEAP_ROLE: api
      SERVICE_NAME: ai-engine
      DATABASE_URL: postgresql+asyncpg://eeap_ai@postgres:5432/eeap
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_ai
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: svc-ai
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_ai
      SCORING_MODEL_VERSION: ${SCORING_MODEL_VERSION:-v1}
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-none}
      AI_LLM_ENDPOINT: ${AI_LLM_ENDPOINT:-}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-}
      AI_LLM_API_KEY_FILE: /run/secrets/llm_api_key
      AI_LLM_REDACT_IDENTIFIERS: "true"
    secrets: &ai-secrets [db_password_ai, redis_password, jwt_public_key, internal_token_public_key, minio_secret_ai, llm_api_key]
    depends_on:
      ai-engine-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck: *python-healthcheck
    # eeap-llm is the only egress-capable network; used solely when an external LLM provider is configured.
    networks: [eeap-backend, eeap-data, eeap-llm]

  ai-worker:
    profiles: [app]
    build: *build-ai-engine
    image: ${EEAP_REGISTRY:-eeap}/ai-engine:${EEAP_VERSION:-0.1.0}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    environment:
      <<: *ai-env
      EEAP_ROLE: worker
      WORKER_CONSUMER_GROUPS: ai-engine.scoring,ai-engine.correlation
    secrets: *ai-secrets
    depends_on:
      ai-engine:
        condition: service_healthy
    healthcheck: *worker-healthcheck
    deploy:
      resources:
        limits: {cpus: "2", memory: 2g}
    networks: [eeap-backend, eeap-data, eeap-llm]

  # ======================================================================= reporting service (profile: app)
  reporting-service-migrate:
    profiles: [app]
    build: &build-reporting-service
      context: .
      dockerfile: services/reporting-service/Dockerfile
    image: ${EEAP_REGISTRY:-eeap}/reporting-service:${EEAP_VERSION:-0.1.0}
    restart: "no"
    logging: *logging
    <<: *hardening
    environment:
      <<: *backend-env
      EEAP_ROLE: migrate
      DATABASE_URL: postgresql+asyncpg://eeap_reporting@postgres:5432/eeap
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_reporting
    secrets: [db_password_reporting, redis_password, jwt_public_key, internal_token_public_key]
    depends_on: *data-deps
    networks: [eeap-data]

  reporting-service:
    profiles: [app]
    build: *build-reporting-service
    image: ${EEAP_REGISTRY:-eeap}/reporting-service:${EEAP_VERSION:-0.1.0}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    environment: &reporting-env
      <<: *backend-env
      EEAP_ROLE: api
      SERVICE_NAME: reporting-service
      DATABASE_URL: postgresql+asyncpg://eeap_reporting@postgres:5432/eeap
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_reporting
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: svc-reporting
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_reporting
      REPORTS_BUCKET: eeap-reports
      REPORT_URL_TTL_SECONDS: ${REPORT_URL_TTL_SECONDS:-300}
    secrets: &reporting-secrets [db_password_reporting, redis_password, jwt_public_key, internal_token_public_key, minio_secret_reporting]
    depends_on:
      reporting-service-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck: *python-healthcheck
    networks: [eeap-backend, eeap-data]

  reporting-worker:
    profiles: [app]
    build: *build-reporting-service
    image: ${EEAP_REGISTRY:-eeap}/reporting-service:${EEAP_VERSION:-0.1.0}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    environment:
      <<: *reporting-env
      EEAP_ROLE: worker
      WORKER_CONSUMER_GROUPS: reporting-service.render
    secrets: *reporting-secrets
    depends_on:
      reporting-service:
        condition: service_healthy
    healthcheck: *worker-healthcheck
    deploy:
      resources:
        limits: {cpus: "2", memory: 2g}
    networks: [eeap-backend, eeap-data]

  # ======================================================================= observability (profile: observability)
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./infrastructure/docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [eeap-observability, eeap-backend, eeap-data]

  loki:
    profiles: [observability]
    image: grafana/loki:3.2.0
    restart: unless-stopped
    logging: *logging
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki
    networks: [eeap-observability]

  promtail:
    profiles: [observability]
    image: grafana/promtail:3.2.0
    restart: unless-stopped
    logging: *logging
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./infrastructure/docker/observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [eeap-observability]

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana_admin_password]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/docker/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/eeap.yml:ro
    networks: [eeap-observability, eeap-grafana]

networks:
  eeap-edge:
    driver: bridge
  eeap-backend:
    driver: bridge
    internal: true
  eeap-data:
    driver: bridge
    internal: true
  eeap-observability:
    driver: bridge
    internal: true
  eeap-grafana:
    driver: bridge
  # Egress to the assessed environment (AD, network targets). Restrict with host firewall / macvlan in production.
  eeap-scan:
    driver: bridge
  # Egress to an external LLM provider; unused when AI_LLM_PROVIDER=none.
  eeap-llm:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  minio_data:
  prometheus_data:
  loki_data:
  grafana_data:

secrets:
  postgres_superuser_password: {file: ./secrets/postgres_superuser_password}
  db_password_gateway:         {file: ./secrets/db_password_gateway}
  db_password_asset:           {file: ./secrets/db_password_asset}
  db_password_assessment:      {file: ./secrets/db_password_assessment}
  db_password_relationship:    {file: ./secrets/db_password_relationship}
  db_password_ai:              {file: ./secrets/db_password_ai}
  db_password_reporting:       {file: ./secrets/db_password_reporting}
  redis_password:              {file: ./secrets/redis_password}
  minio_root_user:             {file: ./secrets/minio_root_user}
  minio_root_password:         {file: ./secrets/minio_root_password}
  minio_secret_assessment:     {file: ./secrets/minio_secret_assessment}
  minio_secret_ai:             {file: ./secrets/minio_secret_ai}
  minio_secret_reporting:      {file: ./secrets/minio_secret_reporting}
  minio_secret_backup:         {file: ./secrets/minio_secret_backup}
  jwt_signing_key:             {file: ./secrets/jwt_signing_key.pem}
  jwt_public_key:              {file: ./secrets/jwt_public_key.pem}
  internal_token_private_key:  {file: ./secrets/internal_token_private_key.pem}
  internal_token_public_key:   {file: ./secrets/internal_token_public_key.pem}
  agent_ca_key:                {file: ./secrets/agent_ca_key.pem}
  agent_ca_cert:               {file: ./secrets/agent_ca_cert.pem}
  tls_cert:                    {file: ./secrets/tls_cert.pem}
  tls_key:                     {file: ./secrets/tls_key.pem}
  llm_api_key:                 {file: ./secrets/llm_api_key}
  ad_bind_password:            {file: ./secrets/ad_bind_password}
  grafana_admin_password:      {file: ./secrets/grafana_admin_password}
