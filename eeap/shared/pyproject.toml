[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eeap-shared"
version = "0.1.0"
description = "Shared runtime library for EEAP services"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0.30,<2.1",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "redis>=5.0,<7",
  "httpx>=0.27,<1",
  "prometheus-client>=0.20,<1",
  "pyjwt[crypto]>=2.9,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4.23"]

[tool.setuptools]
package-dir = {"eeap_shared" = "."}
packages = ["eeap_shared", "eeap_shared.logging", "eeap_shared.utils", "eeap_shared.models"]

[tool.setuptools.package-data]
eeap_shared = ["schemas/*.json", "migrations/*.py", "migrations/*.mako"]
